name: Regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  home-assistant-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-ha-test.txt
      - run: python -B scripts/ha_smoke.py "$GITHUB_WORKSPACE"
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate.py
      - run: python scripts/validate_resources.py
      - run: ruff check custom_components scripts tests
      - run: mypy
      - run: pytest --cov --cov-report=term --cov-report=xml --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: |
            coverage.xml
            test-results.xml
