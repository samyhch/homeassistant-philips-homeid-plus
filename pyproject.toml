[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["custom_components/philips_homeid_plus"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# Start with correctness errors across all inherited and new code. Style and
# unused-import cleanup are separate from transport changes.
select = ["E9", "F821", "F822", "F823"]

[tool.mypy]
python_version = "3.13"
files = ["custom_components/philips_homeid_plus/privacy.py", "custom_components/philips_homeid_plus/pet_series/capabilities.py", "scripts/build_release.py", "scripts/validate.py"]
follow_imports = "skip"
check_untyped_defs = true
warn_unused_ignores = true
